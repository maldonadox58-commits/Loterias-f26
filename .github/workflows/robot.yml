name: Robot de resultados
on:
  schedule:
    # Repaso cada 2 horas. Los sorteos en vivo los vigila vigia.yml.
    - cron: '17 */2 * * *'  # repaso cada 2 horas
  workflow_dispatch:
  push:
    paths: ['robot.py', '.github/workflows/robot.yml']
permissions:
  contents: write
concurrency:
  group: robot
  cancel-in-progress: true
jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ALARMAS: ${{ secrets.ALARMAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Configurar git
        run: |
          git config user.name "robot-f26"
          git config user.email "robot-f26@users.noreply.github.com"
      - name: Repaso
        if: github.event.schedule == '17 */2 * * *' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: python robot.py --push --prueba-log
      - name: Vigilar sorteos
        if: (github.event_name == 'schedule' && github.event.schedule != '17 */2 * * *') || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python robot.py --vigilar 45
